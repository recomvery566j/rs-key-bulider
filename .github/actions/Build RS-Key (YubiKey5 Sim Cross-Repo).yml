name: Build RS-Key (YubiKey5 Sim Cross-Repo)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout upstream repository
        uses: actions/checkout@v4
        with:
          repository: TheMaxMur/RS-Key
          ref: main
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Setup Nix Cache
        uses: nix-community/cache-nix-action@v5
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - name: Setup Cargo Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'flake.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Build firmware with YubiKey5 Opt-in
        env:
          VIDPID: Yubikey5
        run: |
          mkdir -p dist
          pkg="firmware-strong-pin-pqc"
          
          echo "::group::nix build .#$pkg with VIDPID=Yubikey5"
          out="$(nix build ".#$pkg" --impure --no-link --print-out-paths)"
          
          cp "$out/$pkg.uf2" "dist/rs-key-yubikey5-strong-pin-pqc.uf2"
          echo "::endgroup::"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: rs-key-yubikey5-firmware
          path: dist/*.uf2
          retention-days: 7
